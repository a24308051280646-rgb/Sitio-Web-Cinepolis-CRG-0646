<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cinépolis - Club Cinépolis</title>
    <style>
        body { font-family: Arial; margin: 0; background-color: #f4f4f4; }
        header, footer { background-color: #0b2545; color: white; text-align: center; padding: 10px; }
        header h1 { color: #ffcc00; margin: 0; }
        nav { background-color: #134074; text-align: center; padding: 10px; }
        nav a { color: white; text-decoration: none; padding: 10px; font-weight: bold; }
        
        main { width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; }
        h2 { color: #0b2545; text-align: center; }
        
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0b2545; color: white; border: none; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Cinépolis</h1>
        <p>La Capital del Cine</p>
    </header>

    <nav>
        <a href="Cartelera.html">Cartelera</a>
        <a href="Club Cinepolis.html">Club Cinépolis</a>
        <a href="Inicio o Registro.html">Inicio / Registro</a>
    </nav>

    <main>
        <h2>Club Cinépolis</h2>
        <p style="text-align: center;">Ingresa los datos de tu tarjeta:</p>
        
        <form>
            <label for="nombre">Nombre del Titular:</label>
            <input type="text" id="nombre" placeholder="Tu nombre completo" required>

            <label for="tarjeta">Número de Tarjeta:</label>
            <input type="text" id="tarjeta" maxlength="16" placeholder="16 dígitos" required>

            <label for="nivel">Nivel de Tarjeta:</label>
            <select id="nivel" required>
                <option value="">-- Selecciona --</option>
                <option value="fan">Fan</option>
                <option value="fanatico">Fanático</option>
                <option value="super-fanatico">Súper Fanático</option>
            </select>

            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" placeholder="correo@ejemplo.com" required>

            <label for="nip">NIP (4 dígitos):</label>
            <input type="password" id="nip" maxlength="4" placeholder="****" required>

            <button type="submit">Ingresar</button>
        </form>
    </main>

    <footer>
        <p>2026 Cinépolis | Rangel Garcia Cesar | 0646 5ºI</p>
    </footer>

</body>
</html>
