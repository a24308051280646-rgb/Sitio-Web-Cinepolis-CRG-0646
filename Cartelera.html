<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cinépolis - Cartelera</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; color: #333; }
        header, footer { background: #0b2545; color: white; text-align: center; padding: 15px; }
        header h1 { margin: 0; color: #ffcc00; }
        nav { background: #134074; text-align: center; padding: 10px; }
        nav a { color: white; text-decoration: none; padding: 8px 15px; font-weight: bold; display: inline-block; }
        nav a:hover { background: #ffcc00; color: #0b2545; border-radius: 4px; }
        main { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        h2 { border-bottom: 3px solid #0b2545; color: #0b2545; }
        .peliculas { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 30px; }
        .tarjeta { background: white; border-radius: 8px; width: 200px; text-align: center; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .tarjeta img { width: 100%; height: 280px; object-fit: cover; border-radius: 5px; }
        .tarjeta h3 { font-size: 1em; margin: 10px 0 0; color: #0b2545; }
    </style>
</head>
<body>

    <header>
        <h1>Cinépolis</h1>
        <p>La Capital del Cine</p>
    </header>

    <nav>
        <a href="Cartelera.html">Cartelera</a>
        <a href="Club Cinepolis.html">Club Cinépolis</a>
        <a href="Inicio o Registro.html">Inicio / Registro</a>
    </nav>

    <main>
        <section>
            <h2>En Cartelera</h2>
            <div class="peliculas">
                <div class="tarjeta"><img src="Su.png" alt="Súper Canino"><h3>Súper Canino</h3></div>
                <div class="tarjeta"><img src="Your.png" alt="Your Name"><h3>Your Name.</h3></div>
                <div class="tarjeta"><img src="Mu.png" alt="La Isla de las Muñecas"><h3>La Isla de las Muñecas</h3></div>
                <div class="tarjeta"><img src="Ve.png" alt="Verity"><h3>Verity</h3></div>
            </div>
        </section>

        <section>
            <h2>Proximos Estrenos</h2>
            <div class="peliculas">
                <div class="tarjeta"><img src="Pa.png" alt="Pan's Labyrinth"><h3>Pan's Labyrinth</h3></div>
                <div class="tarjeta"><img src="La.png" alt="La Caída de la Ballena"><h3>La Caída de la Ballena</h3></div>
                <div class="tarjeta"><img src="Str.png" alt="Street Fighter"><h3>Street Fighter</h3></div>
                <div class="tarjeta"><img src="El.png" alt="El Corazón de la Bestia"><h3>El Corazón de la Bestia</h3></div>
            </div>
        </section>
    </main>

    <footer>
        <p>2026 Cinépolis | Rangel Garcia Cesar | 0646 5ºI</p>
    </footer>

</body>
</html>
